name: OptionsView Alerts ALGO v1.3 · 100

on:
  workflow_dispatch:

  schedule:
    # 9:15 AM Gillette (MDT / UTC-6)
    - cron: "15 15 * * 1-5"

    # 11:30 AM Gillette (MDT / UTC-6)
    - cron: "30 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: optionsview-alerts
  cancel-in-progress: false

jobs:
  scan-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Show execution time
        run: |
          echo "GitHub run started:"
          date -u
          TZ=America/Denver date

      - name: Run OptionsView scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_WIN_PROB: "68"
          MAX_ALERTS: "6"
          MAX_RISK_PER_TRADE: "500"
          MAX_PER_BUCKET: "2"
        run: python alerts_engine.py

      - name: Append scan to permanent history
        run: python update_history.py

      - name: Update forward-test tracker
        run: python signal_tracker.py

      - name: Commit permanent data
        run: |
          git config user.name "optionsview-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/optionsview_history.csv
          git add data/optionsview_signals.csv
          git add data/optionsview_marks.csv

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: append OptionsView scan + tracker [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload scan backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optionsview-scan-${{ github.run_number }}
          path: optionsview_alerts_scan.csv
          if-no-files-found: ignore
          retention-days: 90
